include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    # Saída de build (gitignored, nunca é código-fonte). Plugins iOS com Swift
    # Package Manager (ex.: firebase_messaging >= 16.x) sincronizam o pacote
    # inteiro — incluindo a própria pasta test/ do pacote — para dentro de
    # build/ios/SourcePackages/. Sem este exclude, `flutter analyze` varre
    # esses testes vendorizados e falha em dependências (ex.: mockito) que só
    # existem no dev_dependencies do pacote de terceiros, não no app.
    - "**/build/**"

linter:
  rules:
    # Qualidade geral
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_print
    - use_key_in_widget_constructors
    - sized_box_for_whitespace
    - avoid_unnecessary_containers

    # i18n enforcement — CRÍTICO
    # Nenhum Text() pode receber string literal em pt-BR
    # Use context.l10n.key em vez de Text('Salvar')
    - avoid_hardcoded_strings_in_widget
