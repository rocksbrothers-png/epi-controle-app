<!-- @dsCard group="Componentes" name="Filter bar" subtitle="chips de filtros ativos + limpar" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter bar — EPI Controle DS</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<div class="preview-frame">
  <h1>Filter bar</h1>
  <p class="lead"><code>dsFilterChips(items)</code> — chips removíveis dos filtros ativos + "Limpar filtros".</p>
  <div class="ds-filter-bar" role="group" aria-label="Filtros ativos" style="max-width:680px;">
    <span class="ds-filter-chip"><span>Colaborador: joão silva</span><button class="ds-filter-chip__remove" aria-label="Remover filtro">×</button></span>
    <span class="ds-filter-chip"><span>EPI: luva</span><button class="ds-filter-chip__remove" aria-label="Remover filtro">×</button></span>
    <span class="ds-filter-chip"><span>Status: Entregue</span><button class="ds-filter-chip__remove" aria-label="Remover filtro">×</button></span>
    <span class="ds-filter-chip"><span>De: 2026-06-01</span><button class="ds-filter-chip__remove" aria-label="Remover filtro">×</button></span>
    <button class="ds-filter-clear-all">Limpar filtros</button>
  </div>
</div>
<button class="btn btn-ghost btn-sm" style="position:fixed;top:14px;right:14px;" onclick="var h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'':'dark')">🌓 tema</button>
</body>
</html>
