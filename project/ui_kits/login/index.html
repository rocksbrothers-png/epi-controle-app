<!-- @dsCard group="UI Kits" name="Login" subtitle="autenticação + recuperação de senha" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — EPI Controle DS</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(1200px 600px at 70% -10%, var(--accent-bg), transparent), var(--bg); }
  .login-panel { width: 100%; max-width: 420px; }
  .login-form { display: flex; flex-direction: column; gap: 14px; }
  .login-form h2 { margin: 0 0 4px; font-size: 20px; }
  .login-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .brand-logo { width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--accent);
    color: #fff; display: grid; place-items: center; font-weight: 800; margin-bottom: 12px; }
  .lead { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-panel card">
    <div class="brand-logo">EPI</div>
    <span class="eyebrow">Controle Administrativo</span>
    <h2>Gerenciamento e controle de EPI</h2>
    <p class="lead">Acesse com seu usuário e senha. Estrutura multi-perfil (Admin Geral, Local, Gestor, Comprador, Funcionário).</p>
    <form class="login-form" onsubmit="return false">
      <label class="field"><span>Usuário</span><input type="text" placeholder="Informe seu usuário" autocomplete="username"></label>
      <label class="field"><span>Senha</span><input type="password" placeholder="Informe sua senha" autocomplete="current-password"></label>
      <div class="login-actions">
        <button type="submit" class="btn btn-primary">Entrar</button>
        <button type="button" class="btn btn-ghost">Esqueci minha senha</button>
      </div>
    </form>
  </div>
</div>
<button class="btn btn-ghost btn-sm" style="position:fixed;top:14px;right:14px;" onclick="var h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'':'dark')">🌓 tema</button>
</body>
</html>
