# Dependabot — atualizações automáticas de dependências.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # ── Backend Python (raiz) ───────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # numpy 2.5.0+ exige Python >= 3.12; o Dockerfile de produção usa
      # python:3.11-slim. Um bump automático para 2.5.1 (dentro do grupo
      # minor/patch, já que não cruza 2.x -> 3.x) quebrou o build Docker no
      # Render (incidente em 2026-07-22/23). Remova este ignore somente após
      # migrar o Dockerfile para Python >= 3.12 e validar toda a stack de
      # imagem (tesseract/opencv/wheels).
      - dependency-name: "numpy"
        versions: [">=2.5.0"]

  # ── Flutter / Dart (workspace melos) ────────────────────────────────────────
  - package-ecosystem: pub
    directory: "/flutter"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencies", "flutter"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dart-minor-patch:
        update-types: ["minor", "patch"]

  # ── Frontend JS (eslint / toolchain do web legado) ──────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # ── GitHub Actions (mantém as actions dos workflows atualizadas) ─────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-all:
        patterns: ["*"]
