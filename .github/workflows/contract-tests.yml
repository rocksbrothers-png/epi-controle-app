name: Contract Tests

# Testes de contrato entre Flutter (cliente) e Backend (API):
# envelope {success,data,message}, formato JSON, enums, paginação, filtros,
# erros, autenticação/autorização e escopo Multi-Tenant.
#
# Objetivo: qualquer alteração incompatível na API DEVE quebrar a CI aqui,
# antes de chegar ao app Flutter. Os testes de contrato vivem em `tests/` e
# são selecionados por nome (marcador de convenção).
#
# Governança de required status check (issue de rastreamento: rocksbrothers-png/
# epi-controle#851 / epi-controle-app#187): `contract` é required check. Até
# esta mudança, o filtro de path vivia em `on:`, então um PR que não tocasse
# nenhum desses paths (docs-only, dependência do Flutter, workflow não-backend)
# nunca disparava o workflow inteiro — e um required check que nunca dispara
# fica "Expected" para sempre, bloqueando o merge sem nenhum problema real
# (evidência completa na issue). Agora o workflow SEMPRE dispara; o job
# `changes` decide via dorny/paths-filter se o path é relevante, e o job real
# roda condicionado a esse resultado — irrelevante = "skipped" (satisfaz um
# required check), relevante = roda de verdade.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            contract:
              - "epi_backend/**"
              - "modules/**"
              - "tests/test_*contract*.py"
              - "tests/test_*scope*.py"
              - "tests/test_auth_*.py"
              - ".github/workflows/contract-tests.yml"

  contract:
    name: API Contract & Multi-Tenant Scope
    needs: changes
    if: needs.changes.outputs.contract == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # Timeout PRÓPRIO, menor que o do job (#264). Sem ele, um `apt-get`
      # estolado consome os 15 min inteiros e o job morre `cancelled` — sem
      # rodar teste nenhum e com um sinal que parece defeito do commit. Aqui a
      # falha é do PASSO, com mensagem dizendo que a causa é dependência de
      # sistema, e a conclusão do job vira `failure`, não `cancelled`.
      #
      # Orçamento: 3 tentativas x (45s update + 120s install) + 30s de espera
      # = 525s no pior caso, dentro dos 10 min do passo. Os 5 min restantes do
      # job sobram para pip + suíte (o espelho faz o job inteiro em ~4min30).
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          set -uo pipefail

          # `timeout` por comando, não só no passo: o estol é uma conexão
          # pendurada no mirror de pacotes, e sem limite por tentativa a
          # primeira consumiria o orçamento todo e as outras duas nunca
          # aconteceriam — o retry existiria só no papel.
          instalar_dependencias() {
            timeout 45 sudo apt-get update -qq \
              && timeout 120 sudo apt-get install -y --no-install-recommends \
                   tesseract-ocr tesseract-ocr-eng tesseract-ocr-por \
                   libgl1 libglib2.0-0
          }

          for tentativa in 1 2 3; do
            if instalar_dependencias; then
              echo "Dependências de sistema instaladas (tentativa ${tentativa}/3)."
              exit 0
            fi
            if [ "${tentativa}" -lt 3 ]; then
              espera=$((tentativa * 10))
              echo "::warning::apt-get não concluiu (tentativa ${tentativa}/3); repetindo em ${espera}s"
              sleep "${espera}"
            fi
          done

          echo "::error::Dependências de SISTEMA indisponíveis após 3 tentativas de apt-get. Isto NÃO é falha dos testes de contrato — ver #264."
          exit 1

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Run contract + scope tests
        run: |
          pytest tests/ -v --tb=short \
            -k "contract or scope or auth or envelope or permission" \
            --junitxml=contract-junit.xml

      - name: Upload contract test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-tests-${{ github.sha }}
          path: contract-junit.xml
          retention-days: 14
