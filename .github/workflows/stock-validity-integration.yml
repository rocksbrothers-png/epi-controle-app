name: Stock Validity Integration

on:
  pull_request:
    paths: ['modules/**', 'core/**', 'epi_backend/**', 'flutter/**', 'scripts/stock_r1_http_fixture.py', 'tests_postgres/test_est_v3_5_pending_regularization_http.py', 'tests_postgres/test_est_v3_5_postmerge_receipt.py', 'tests_postgres/test_stock_manual_receipt_validity_http.py', 'tests_postgres/test_stock_lot_evidence_http.py', '.github/workflows/stock-validity-integration.yml']
  push:
    branches: ['claude/**']
    paths: ['modules/**', 'core/**', 'epi_backend/**', 'flutter/**', 'scripts/stock_r1_http_fixture.py', 'tests_postgres/test_est_v3_5_pending_regularization_http.py', 'tests_postgres/test_est_v3_5_postmerge_receipt.py', 'tests_postgres/test_stock_manual_receipt_validity_http.py', 'tests_postgres/test_stock_lot_evidence_http.py', '.github/workflows/stock-validity-integration.yml']

jobs:
  physical-stock-http:
    name: Flutter HTTP + native JWT + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epi
          POSTGRES_PASSWORD: epi
          POSTGRES_DB: stock_r1_integration
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://epi:epi@127.0.0.1:5432/stock_r1_integration
      JWT_ENFORCEMENT_MODE: enforce
      PGPASSWORD: epi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare isolated backend
        run: |
          pip install -r requirements.txt pytest
          psql -h 127.0.0.1 -U epi -d stock_r1_integration -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Pending regularization HTTP scope regression
        run: python -m pytest -q tests_postgres/test_est_v3_5_pending_regularization_http.py
      - name: Prepare Flutter
        working-directory: flutter
        run: |
          flutter pub get
          dart run melos run gen:l10n
          dart run melos run gen
      - name: Validate R3 receipt HTTP contract and adversarial quantities
        run: |
          python -m pytest -q tests_postgres/test_est_v3_5_r3_lot_receipt.py tests_postgres/test_est_v3_5_r3_lot_receipt_http.py tests_postgres/test_est_v3_5_r3_effective_receipt_http.py
      - name: Validate post-merge receipt integrity and concurrency
        run: python -m pytest -q tests_postgres/test_est_v3_5_postmerge_receipt.py
      - name: Validate manual batch receipt and physical expiry evidence
        run: python -m pytest -q tests_postgres/test_stock_manual_receipt_validity_http.py
      - name: Validate physical lot evidence, files and access scope
        run: python -m pytest -q tests_postgres/test_stock_lot_evidence_http.py
      - name: Exercise real HTTP and PostgreSQL from Flutter
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stock_r1_http_fixture.py
