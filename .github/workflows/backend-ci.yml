name: Backend CI

# CI do backend Python (substitui o antigo "node.js.yml"/Python CI).
#   • test            — pytest completo + cobertura (relatório + artefato).
#   • lint            — ruff (não bloqueante até o baseline estar limpo).
#   • postgres-schema — sobe PostgreSQL 16 e valida as migrations SQL + regras
#                       Multi-Tenant (tenant_id / RLS). Não bloqueante por ora.
#
# Nota sobre banco: a suíte de testes roda intencionalmente em SQLite/mocks (sem
# DATABASE_URL). NÃO defina DATABASE_URL no job `test`, senão o backend alterna
# para o driver Postgres e quebra os testes de schema em SQLite. A validação
# Postgres real vive no job dedicado `postgres-schema`.
#
# Governança de required status check (issue de rastreamento: rocksbrothers-png/
# epi-controle#851 / epi-controle-app#187): `lint`/`postgres-schema` são
# required checks. Até esta mudança, o filtro de path vivia em `on:`, então um
# PR que não tocasse nenhum desses paths (docs-only, dependência do Flutter,
# workflow não-backend) nunca disparava o workflow inteiro — e um required
# check que nunca dispara fica "Expected" para sempre, bloqueando o merge sem
# nenhum problema real (evidência completa na issue). Agora o workflow SEMPRE
# dispara; o job `changes` decide via dorny/paths-filter se o path é relevante,
# e cada job real roda condicionado a esse resultado — irrelevante = "skipped"
# (satisfaz um required check), relevante = roda de verdade.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - "epi_backend/**"
              - "modules/**"
              - "tests/**"
              - "app.py"
              - "requirements.txt"
              - "supabase/migrations/**"
              - ".github/workflows/backend-ci.yml"
            frontend:
              - "static/**"
              - ".github/workflows/backend-ci.yml"

  test:
    name: Test & Coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Mesma versão do Dockerfile (FROM python:3.11-slim) usado no Render.
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-por tesseract-ocr-spa \
            tesseract-ocr-nor tesseract-ocr-fra libgl1 libglib2.0-0

      - name: Install Python dependencies
        # `ruff` entra aqui porque `tests/test_948_gate_f401.py` o invoca para
        # provar o baseline de F401 e para rodar a sabotagem. Sem ele os gates
        # não falham por defeito — falham por ferramenta ausente, que é ruído.
        # A versão é a MESMA do job de lint, e o gate reprova se as duas
        # divergirem: dois pins que se soltam um do outro medem árvores
        # diferentes e voltam a produzir baseline móvel.
        run: pip install -r requirements.txt pytest pytest-cov ruff==0.16.5

      - name: Run tests with coverage
        # Cobertura é relatada mas ainda NÃO é gate (sem --cov-fail-under).
        # Meça o baseline nos primeiros runs e então ative o mínimo (ex.: 80%).
        run: |
          pytest tests/ -v --tb=short \
            --cov=epi_backend --cov=modules \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml

      - name: Upload coverage & test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  frontend-tests:
    name: Frontend Tests (JS)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # `static/js/test/run-tests.js` existia desde antes da #271 com centenas
      # de asserções — e NUNCA foi executado por nenhum workflow (#271-B4). Um
      # teste que não roda não é gate: ele parece proteção no diff e não
      # participa de decisão nenhuma. Este job existe para fechar isso.
      #
      # O harness não tem dependências: usa apenas `fs`, `path` e `vm` da
      # stdlib do Node, carrega os módulos de `static/js/` em contexto isolado
      # e sai com código 1 na primeira falha.
      - name: Run JS unit tests
        run: node static/js/test/run-tests.js

  lint:
    name: Lint (ruff)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        # Versão EXATA, e é requisito da fatia 1 da #948, não preferência de
        # estilo. Com `pip install ruff` o baseline se move sozinho a cada
        # release: a mesma árvore de 24/08 media 56 achados com o ruff da época
        # e mede 310 com o 0.16.5. Um gate bloqueante sobre baseline móvel fica
        # vermelho em código que ninguém tocou — e o reflexo seria devolver o
        # `continue-on-error`, desfazendo o gate.
        run: pip install ruff==0.16.5
      - name: Ruff check (amplo, não bloqueante)
        # Continua não bloqueante: ~300 achados de outras regras pertencem às
        # fatias 2 e 3 da #948. Ampliar aqui agora misturaria a limpeza
        # histórica com o gate que impede dívida nova.
        continue-on-error: true
        run: ruff check epi_backend modules app.py --output-format=github
      - name: Ruff F401 em tests/ e scripts/ (bloqueante)
        # Fatia 1 da #948, e o único gate de lint que reprova hoje.
        #
        # `tests/` e `scripts/` não eram lintados por ninguém: o CodeQL achava
        # os imports ociosos DEPOIS do push, como comentário de review. Duas
        # ocorrências idênticas em fatias consecutivas da #271 é padrão, não
        # descuido.
        #
        # Tolerância ZERO e por seleção de regra, nunca por supressão: sem
        # `continue-on-error`, sem `--exit-zero`, sem arquivo de baseline e sem
        # allowlist de violações conhecidas. Uma regra está no gate a zero ou
        # não está no gate — jamais "no gate acima de N", que é o que deixaria
        # dívida nova entrar por baixo do número.
        run: ruff check tests scripts --select F401 --output-format=github

  postgres-schema:
    name: PostgreSQL Schema & Multi-Tenant
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epi
          POSTGRES_PASSWORD: epi
          POSTGRES_DB: epi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epi -d epi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: epi
      PGPASSWORD: epi
      PGDATABASE: epi_ci
    steps:
      - uses: actions/checkout@v7

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U epi -d epi_ci && break
            sleep 2
          done
          psql -h localhost -U epi -d epi_ci -c "SELECT version();"

      # Pré-condições da PLATAFORMA, não fixture de teste.
      #
      # 16 das 32 migrations criam policies `TO anon, authenticated`. Esses dois
      # roles existem em qualquer projeto Supabase e NÃO existem na imagem
      # `postgres:16`. Sem eles todo `CREATE POLICY` morre em
      # `role "anon" does not exist`, e o que o CI mede deixa de ser a qualidade
      # das migrations: passa a ser a ausência do Supabase.
      #
      # Medido na etapa 1, mesma árvore, sem uma linha de migration alterada:
      #   sem os roles → 16/32 `.sql` falham · 1 de 28 migrations Python aplicam
      #                  · 72 tabelas sem RLS · 73 sem policy · exit 1
      #   com os roles → 0 falhas · 28/28 · 0 sem RLS · 0 sem policy · exit 0
      #
      # O que isto NÃO prova: `NOLOGIN` sem `GRANT` permite que as policies
      # sejam CRIADAS, não que elas ISOLEM. Provar isolamento exige conectar
      # como `anon` e verificar que a leitura é negada — frente própria.
      #
      # `service_role` fica de fora de propósito: nenhuma migration o referencia.
      - name: Pré-condições do Supabase (roles anon e authenticated)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h localhost -U epi -d epi_ci -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                CREATE ROLE anon NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                CREATE ROLE authenticated NOLOGIN;
              END IF;
            END
            \$\$;"
          psql -v ON_ERROR_STOP=1 -h localhost -U epi -d epi_ci -tAc \
            "SELECT rolname FROM pg_roles WHERE rolname IN ('anon','authenticated') ORDER BY 1;"

      # Validação estática Multi-Tenant: as migrations de RLS DEVEM referenciar
      # tenant_id/company_id e criar policies. Isto é sempre seguro (não aplica
      # SQL), garante que ninguém remova o isolamento por engano.
      #
      # O `--include=*.sql` não é detalhe de estilo: sem ele o grep varre o
      # diretório inteiro, e qualquer arquivo de texto que mencione os termos
      # (um README, por exemplo) satisfaz a verificação sozinho — o gate ficaria
      # verde mesmo sem nenhuma migration. Restringir às migrations mantém a
      # asserção sobre o que ela diz medir.
      - name: Validate Multi-Tenant invariants (static)
        run: |
          set -e
          echo "Verificando referências a tenant/company e RLS nas migrations…"
          if ! grep -rilE --include='*.sql' "tenant_id|company_id" supabase/migrations >/dev/null; then
            echo "::error::Nenhuma migration referencia tenant_id/company_id — isolamento Multi-Tenant ausente."
            exit 1
          fi
          if ! grep -rilE --include='*.sql' "ROW LEVEL SECURITY|CREATE POLICY" supabase/migrations >/dev/null; then
            echo "::error::Nenhuma migration habilita RLS / CREATE POLICY."
            exit 1
          fi
          echo "OK: invariantes Multi-Tenant presentes nas migrations."

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ETAPA 3 da #275 — BLOQUEANTE. O `continue-on-error` saiu daqui.
      #
      # O passo original aplicava os 32 `.sql` contra um banco VAZIO e ficava
      # verde por três motivos independentes: o `continue-on-error`, o `set +e`,
      # e — o que quase ninguém nota — o `$?` de cada `psql` ser apenas ecoado
      # no log, nunca acumulado, com o passo terminando em `cat … || true`.
      # Remover só o `continue-on-error` não teria mudado nada. As etapas 1 e 2
      # existiram para que, aqui, remover essa linha tivesse efeito real.
      #
      # Pior que as 9 que falhavam: 18 PASSAVAM SEM FAZER NADA. Elas guardam
      # cada bloco com `CONTINUE WHEN NOT EXISTS (information_schema.tables)`,
      # e contra banco vazio pulam tudo com sucesso. São as de RLS.
      #
      # O schema-base vem dos `ensure_*` do bootstrap real — nunca de um
      # `base_schema.sql` mantido à parte, que divergiria em silêncio (#238).
      # `run_pending_migrations` NÃO cria schema: valida a trilha operacional
      # depois que a base existe.
      #
      # O `continue-on-error` do Ruff (job `Lint`) é da fase 2 da #948 e NÃO
      # foi tocado. Um gate confere que o sobrevivente é aquele, não este.
      - name: Migrations — as duas trilhas, bloqueante (#275 etapa 3)
        env:
          DATABASE_URL: postgresql://epi:epi@localhost:5432/epi_ci
        run: |
          # `pipefail` não é estilo. O shell padrão do Actions é `bash -e {0}`,
          # e numa pipeline o status é o do ÚLTIMO comando: sem isto, o `tee`
          # devolve 0 e o exit code do relatório vai para o lixo. É o MESMO
          # defeito que esta issue existe para matar — o passo antigo ecoava o
          # `$?` de cada psql e terminava em `cat … || true` — só que uma camada
          # acima. Sem `pipefail`, tirar o `continue-on-error` não muda nada, e
          # um gate roda esta pipeline de verdade para provar que muda.
          set -euo pipefail
          mkdir -p /tmp/mig-logs
          python scripts/ci_migrations_report.py 2>&1 | tee /tmp/mig-logs/relatorio.txt

      - name: Upload migration log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-migration-log-${{ github.sha }}
          path: /tmp/mig-logs/
          retention-days: 7
