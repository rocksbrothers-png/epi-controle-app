name: Colaboradores and outsourced browser regression
on:
  pull_request:
    paths:
      - 'static/**'
      - 'scripts/browser/fix_colab_terc.py'
      - 'scripts/browser/fix_nav_refresh.py'
      - 'scripts/browser/ubx_units_legal_entities.py'
      - 'scripts/browser/ubx_companies.py'
      - 'scripts/browser/fix_empresas_active.py'
      - 'scripts/browser/ubx_my_company.py'
      - 'scripts/browser/security_logo_xss.py'
      - 'scripts/browser/security_output_xss.py'
      - 'scripts/browser/i18n_codeql_regression.py'
      - 'scripts/i18n/check_connectors_browser.py'
      - 'scripts/browser/security_csp_v1.py'
      - 'scripts/i18n/check_supplier_portal_csp_sri.py'
      - 'scripts/browser/security_output_xss_v2.py'
      - 'modules/ficha/**'
      - '.github/workflows/fix-colab-terc-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Chromium functional regression (five locales)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # python-dotenv: o cenário da ficha HTML (SECURITY-OUTPUT-XSS-V1) importa o renderizador do backend.
      - run: pip install playwright==1.58.0 'python-dotenv>=1.2.4,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser/fix_colab_terc.py --output browser-evidence
      # FIX-NAV-REFRESH-V1: tela mantida, uma requisição por lista, aviso verdadeiro, clique duplo.
      - if: ${{ !cancelled() }}
        run: python scripts/browser/fix_nav_refresh.py --output browser-evidence/nav-refresh
      # UBX-V5, Etapa 2: telas de CNPJs e Unidades sobre modules/legal-entities e modules/units.
      - if: ${{ !cancelled() }}
        run: python scripts/browser/ubx_units_legal_entities.py --output browser-evidence/units-legal-entities
      # UBX-V5, Etapa 2: tela de Empresas sobre modules/companies.
      - if: ${{ !cancelled() }}
        run: python scripts/browser/ubx_companies.py --output browser-evidence/companies
      # FIX-EMPRESAS-ACTIVE-V1: campo Situação carrega, mostra e grava 1/0 nos 5 idiomas.
      - if: ${{ !cancelled() }}
        run: python scripts/browser/fix_empresas_active.py --output browser-evidence/empresas-active
      # UBX-V5, Etapa 2: Minha Empresa (configurações e domínios) sobre modules/my-company.
      - if: ${{ !cancelled() }}
        run: python scripts/browser/ubx_my_company.py --output browser-evidence/my-company
      # SECURITY-LOGO-XSS-V1: logotipo malicioso não executa (login, topo, Empresas, Minha Empresa); legítimo aparece.
      - if: ${{ !cancelled() }}
        run: python scripts/browser/security_logo_xss.py --output browser-evidence/security-logo-xss
      # SECURITY-OUTPUT-XSS-V1: nome/CNPJ, EPI/foto e ficha HTML (com CSP) não executam HTML do cadastro.
      - if: ${{ !cancelled() }}
        run: python scripts/browser/security_output_xss.py --output browser-evidence/security-output-xss
      # I18N-FULL-V1: texto DOM permanece inerte; bindings ricos só criam ênfase permitida.
      - if: ${{ !cancelled() }}
        name: I18N CodeQL DOM regression (five locales)
        run: python scripts/browser/i18n_codeql_regression.py --output browser-evidence/i18n-codeql
      # I18N-FULL-V1: erros aninhados, nomes de conectores e JSON preservado.
      - if: ${{ !cancelled() }}
        name: I18N supplier connectors (five locales)
        run: python scripts/i18n/check_connectors_browser.py --output browser-evidence/i18n-connectors
      # SECURITY-OUTPUT-XSS-V2: texto de colaborador, unidade e EPI contaminado em todas as telas não executa.
      - if: ${{ !cancelled() }}
        run: python scripts/browser/security_output_xss_v2.py --output browser-evidence/security-output-xss-v2
      # CSP aplicada: ações delegadas da SPA, portal modular com SRI e negativos.
      - if: ${{ !cancelled() }}
        name: CSP functional regression (five locales)
        run: python -u scripts/browser/security_csp_v1.py --output browser-evidence/security-csp
      - if: ${{ !cancelled() }}
        name: Supplier portal CSP and SRI boundaries (five locales)
        run: python scripts/i18n/check_supplier_portal_csp_sri.py --output browser-evidence/portal-csp-sri
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fix-colab-terc-browser-${{ github.sha }}
          path: browser-evidence/
          retention-days: 14
