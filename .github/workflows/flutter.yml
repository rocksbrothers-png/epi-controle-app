name: Flutter CI

on:
  push:
    paths:
      - 'flutter/**'
    branches: [main, 'claude/**']
  pull_request:
    paths:
      - 'flutter/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: flutter

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gates de i18n independentes do Flutter SDK — falham rápido.
      - name: Validate ARB consistency (epi_i18n)
        run: python3 tool/validate_arb.py

      - name: i18n gate (no new hardcoded strings)
        run: bash tool/check_hardcoded_strings.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          dart pub get
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> $GITHUB_PATH

      - name: Bootstrap monorepo
        run: melos bootstrap

      - name: Generate l10n
        run: melos run gen:l10n

      - name: Code generation (retrofit, json_serializable)
        run: melos run gen

      - name: Analyze
        run: melos run lint

      - name: Test
        run: melos run test

  build-apk-debug:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          dart pub get
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> $GITHUB_PATH

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate l10n
        run: melos run gen:l10n

      - name: Code generation (retrofit, json_serializable)
        run: melos run gen

      - name: Build APK debug
        run: melos run build:apk
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epi-admin-debug-${{ github.sha }}.apk
          path: flutter/apps/epi_admin/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-android:
    name: Build Android (AAB)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          dart pub get
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> $GITHUB_PATH

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate l10n
        run: melos run gen:l10n

      - name: Code generation (retrofit, json_serializable)
        run: melos run gen

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/epi_admin/android/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n' \
              "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
              > apps/epi_admin/android/key.properties
            echo "Signing configured."
          else
            echo "ANDROID_KEYSTORE_BASE64 not set — skipping signing setup."
          fi

      - name: Build AAB
        run: melos run build:android
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: epi-admin-release-${{ github.sha }}
          path: flutter/apps/epi_admin/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          dart pub get
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> $GITHUB_PATH

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate l10n
        run: melos run gen:l10n

      - name: Code generation (retrofit, json_serializable)
        run: melos run gen

      - name: Build Web
        run: melos run build:web
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: epi-admin-web-${{ github.sha }}
          path: flutter/apps/epi_admin/build/web/
          retention-days: 30

  integration-android:
    name: Integration (Android emulator)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    # Roda no push (main/claude-**); pulado no espelho de pull_request para não
    # gastar minutos de emulador duas vezes.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          dart pub get
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> $GITHUB_PATH

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate l10n
        run: melos run gen:l10n

      - name: Code generation (retrofit, json_serializable)
        run: melos run gen

      # Habilita aceleração KVM no runner (emulador x86_64 só boota com ela).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: flutter/apps/epi_admin
          script: flutter test integration_test/smoke_test.dart
