name: Flutter CI

on:
  push:
    paths:
      - 'flutter/**'
    branches: [main, 'claude/**']
  pull_request:
    paths:
      - 'flutter/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: flutter

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gates de i18n independentes do Flutter SDK — falham rápido.
      - name: Validate ARB consistency (epi_i18n)
        run: python3 tool/validate_arb.py

      - name: i18n gate (no new hardcoded strings)
        run: bash tool/check_hardcoded_strings.sh

      # Drift entre epi-controle e epi-controle-app. Compara o conteúdo
      # normalizado dos arquivos que precisam permanecer funcionalmente
      # sincronizados contra o manifesto compartilhado pelos dois repositórios
      # — sem precisar de credencial para ler o outro repo.
      - name: Parity gate (mirror drift)
        run: python3 tool/check_parity_drift.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          dart pub get
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> $GITHUB_PATH

      - name: Bootstrap monorepo
        run: melos bootstrap

      - name: Generate l10n
        run: melos run gen:l10n

      - name: Code generation (retrofit, json_serializable)
        run: melos run gen

      - name: Analyze
        run: melos run lint

      - name: Test
        run: melos run test

  build-apk-debug:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          dart pub get
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> $GITHUB_PATH

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate l10n
        run: melos run gen:l10n

      - name: Code generation (retrofit, json_serializable)
        run: melos run gen

      - name: Build APK debug
        run: melos run build:apk
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: epi-admin-debug-${{ github.sha }}.apk
          path: flutter/apps/epi_admin/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # Sonda os secrets de assinatura. Existe porque `secrets` NÃO é acessível num
  # `if:` de job — só dentro de um step. Sem esta sonda, a única forma de
  # reagir à ausência dos secrets seria dentro do próprio job de build, que a
  # essa altura já teria sido marcado como executado.
  #
  # O que isto resolve (issue #200): antes, `Build Android (AAB)` rodava sempre
  # na `main`, o passo de assinatura imprimia "skipping" e saía 0, e o
  # `flutter build appbundle --release` falhava depois com `storeFile` nulo. O
  # resultado era um job VERMELHO por falta de configuração — indistinguível,
  # no painel, de um job vermelho por código quebrado.
  android-signing:
    name: Check Android signing secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      - id: probe
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # Os quatro são exigidos juntos: um keystore sem alias/senha produz
          # exatamente a mesma falha de build que keystore nenhum, e é bem mais
          # difícil de diagnosticar. Parcialmente configurado conta como NÃO
          # configurado — e o resumo abaixo diz qual falta.
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✅ Secrets de assinatura presentes — o AAB será gerado assinado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "⏭️ **Build Android (AAB) será pulado.**"
              echo ""
              echo 'Secrets ausentes:'"$missing"
              echo ""
              echo 'Isto não é uma falha: sem chave de assinatura não existe AAB de release.'
              echo 'Para habilitar, veja `docs/ci-cd/ANDROID_SIGNING.md`.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-android:
    name: Build Android (AAB)
    runs-on: ubuntu-latest
    needs: [analyze-and-test, android-signing]
    # Sem secrets o job fica SKIPPED, nunca vermelho (#200). O `skipped` é
    # honesto: o artefato realmente não pôde ser produzido, e a razão está no
    # resumo do job `android-signing`.
    if: github.ref == 'refs/heads/main' && needs.android-signing.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          dart pub get
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> $GITHUB_PATH

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate l10n
        run: melos run gen:l10n

      - name: Code generation (retrofit, json_serializable)
        run: melos run gen

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # O job `android-signing` já garantiu que os quatro existem. Este
          # `exit 1` é defesa em profundidade: se alguém remover o gate no
          # futuro, a falha aponta o secret ausente em vez de reaparecer três
          # passos adiante como um erro de Gradle sobre `storeFile` nulo — que
          # foi exatamente o que tornou a #200 difícil de diagnosticar.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 ausente. Este job só deveria rodar com os secrets configurados (ver job android-signing e docs/ci-cd/ANDROID_SIGNING.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/epi_admin/android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > apps/epi_admin/android/key.properties
          echo "Signing configured."

      - name: Build AAB
        run: melos run build:android
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: epi-admin-release-${{ github.sha }}
          path: flutter/apps/epi_admin/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          dart pub get
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> $GITHUB_PATH

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate l10n
        run: melos run gen:l10n

      - name: Code generation (retrofit, json_serializable)
        run: melos run gen

      - name: Build Web
        run: melos run build:web
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}

      - name: Upload Web build
        uses: actions/upload-artifact@v7
        with:
          name: epi-admin-web-${{ github.sha }}
          path: flutter/apps/epi_admin/build/web/
          retention-days: 30

  integration-android:
    name: Integration (Android emulator)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    # Roda no push (main/claude-**); pulado no espelho de pull_request para não
    # gastar minutos de emulador duas vezes.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          dart pub get
          dart pub global activate melos
          echo "$PUB_CACHE/bin" >> $GITHUB_PATH

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate l10n
        run: melos run gen:l10n

      - name: Code generation (retrofit, json_serializable)
        run: melos run gen

      # Habilita aceleração KVM no runner (emulador x86_64 só boota com ela).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: flutter/apps/epi_admin
          # Diretório inteiro: o smoke (backend-free) mais o E2E do Multi-CNPJ,
          # que sobe um HttpServer local com respostas canônicas.
          script: flutter test integration_test
