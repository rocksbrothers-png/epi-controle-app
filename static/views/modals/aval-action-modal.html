        <div id="aval-action-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;">
          <div class="card" style="width:min(500px,92vw);padding:24px;max-height:90vh;overflow-y:auto;">
            <h3 id="aval-modal-title" style="margin-top:0;">Ação</h3>
            <input type="hidden" id="aval-modal-feedback-id">
            <input type="hidden" id="aval-modal-action">

            <div id="aval-modal-validate-fields">
              <label style="display:block;margin-bottom:10px;">Tipo de Feedback
                <select id="aval-modal-subtype" style="width:100%;margin-top:4px;">
                  <option value="reclamacao">Reclamação</option>
                  <option value="elogio">Elogio</option>
                  <option value="sugestao_nova">Sugestão de novo EPI</option>
                  <option value="avaliacao_geral">Avaliação Geral</option>
                </select>
              </label>
              <label style="display:block;margin-bottom:10px;">Nível de Risco para o Colaborador
                <select id="aval-modal-risk" style="width:100%;margin-top:4px;">
                  <option value="nenhum">Nenhum</option>
                  <option value="baixo">Baixo</option>
                  <option value="medio">Médio</option>
                  <option value="alto">Alto — pode ocasionar acidente</option>
                </select>
              </label>
              <div id="aval-modal-rank-field" style="display:none;">
                <label style="display:block;margin-bottom:10px;">Avaliação do EPI (Rank)
                  <select id="aval-modal-epi-rank" style="width:100%;margin-top:4px;">
                    <option value="">Selecione</option>
                  </select>
                </label>
              </div>
            </div>

            <div id="aval-modal-reject-fields" style="display:none;">
              <label style="display:block;margin-bottom:10px;">Motivo da Recusa
                <select id="aval-modal-rejection-reason" style="width:100%;margin-top:4px;">
                  <option value="sem_ca" data-i18n="epi.withoutBrazilCa">Sem CA aprovado pelo Brasil</option>
                  <option value="fornecedor_nao_aprovado">Fornecedor não aprovado</option>
                  <option value="outro">Outro motivo</option>
                </select>
              </label>
              <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                <input type="checkbox" id="aval-modal-supplier-eval"> Solicitar avaliação de novo fornecedor
              </label>
            </div>

            <div id="aval-modal-reassessment-fields" style="display:none;">
              <label style="display:block;margin-bottom:10px;">Período de Reavaliação
                <select id="aval-modal-period" style="width:100%;margin-top:4px;">
                  <option value="3_meses">3 meses</option>
                  <option value="6_meses">6 meses</option>
                </select>
              </label>
            </div>

            <div id="aval-modal-accept-suggestion-fields" style="display:none;">
              <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                <input type="checkbox" id="aval-modal-create-epi"> Criar EPI no cadastro imediatamente
              </label>
              <div id="aval-modal-epi-fields" style="display:none;">
                <label style="display:block;margin-bottom:10px;"><span data-i18n="epi.ca">CA (Certificado de Aprovação)</span>
                  <input type="text" id="aval-modal-ca" style="width:100%;margin-top:4px;" placeholder="Número do CA" data-i18n-placeholder="epi.caNumberHint">
                </label>
                <label style="display:block;margin-bottom:10px;">Setor
                  <input type="text" id="aval-modal-sector" style="width:100%;margin-top:4px;" placeholder="Setor de uso">
                </label>
              </div>
            </div>

            <div id="aval-modal-admin-eval-fields" style="display:none;">
              <label id="aval-tech-decision-label" style="display:block;margin-bottom:10px;"><span id="aval-tech-decision-label-text">Decisão Final</span>
                <select id="aval-modal-tech-decision" style="width:100%;margin-top:4px;">
                  <option value="aceito">✓ Aceitar</option>
                  <option value="recusado">✗ Recusar</option>
                </select>
              </label>
              <label style="display:block;margin-bottom:10px;">Atende à Norma Regulamentadora (NR)?
                <select id="aval-modal-atende-nr" style="width:100%;margin-top:4px;">
                  <option value="">Não informado</option>
                  <option value="sim">Sim</option>
                  <option value="nao">Não</option>
                </select>
              </label>
              <label style="display:block;margin-bottom:10px;">Reduz o risco relatado?
                <select id="aval-modal-reduz-risco" style="width:100%;margin-top:4px;">
                  <option value="">Não informado</option>
                  <option value="pouco">Pouco</option>
                  <option value="moderadamente">Moderadamente</option>
                  <option value="totalmente">Totalmente</option>
                </select>
              </label>
              <fieldset style="border:1px solid var(--color-border,#e5e7eb);border-radius:6px;padding:10px 12px;margin-bottom:10px;">
                <legend style="font-size:12px;font-weight:600;padding:0 4px;">Problemas Observados</legend>
                <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><input type="checkbox" class="aval-problema" value="causa_alergia"> Causa alergia</label>
                <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><input type="checkbox" class="aval-problema" value="embaca_visao"> Embaça a visão</label>
                <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><input type="checkbox" class="aval-problema" value="peso_excessivo"> Peso excessivo</label>
                <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><input type="checkbox" class="aval-problema" value="tamanho_inadequado"> Tamanho inadequado</label>
                <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><input type="checkbox" class="aval-problema" value="desconforto_termico"> Desconforto térmico</label>
                <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" class="aval-problema" value="durabilidade_baixa"> Durabilidade baixa</label>
              </fieldset>
              <label style="display:block;margin-bottom:10px;">Custo Estimado (R$)
                <input type="text" id="aval-modal-custo" style="width:100%;margin-top:4px;" placeholder="Ex: 150,00">
              </label>
              <label style="display:block;margin-bottom:10px;">Durabilidade Esperada
                <select id="aval-modal-durabilidade" style="width:100%;margin-top:4px;">
                  <option value="">Não informado</option>
                  <option value="dias">Dias</option>
                  <option value="semanas">Semanas</option>
                  <option value="1_mes">1 Mês</option>
                  <option value="3_meses">3 Meses</option>
                  <option value="6_meses">6 Meses</option>
                  <option value="12_meses">12 Meses</option>
                </select>
              </label>
              <label style="display:block;margin-bottom:10px;">Disponibilidade no Mercado
                <select id="aval-modal-disponibilidade" style="width:100%;margin-top:4px;">
                  <option value="">Não informado</option>
                  <option value="facil">Fácil de encontrar</option>
                  <option value="media">Média disponibilidade</option>
                  <option value="dificil">Difícil de encontrar</option>
                </select>
              </label>
              <label style="display:block;margin-bottom:10px;">Observações Técnicas / Detalhes
                <textarea id="aval-modal-tech-notes" rows="3" style="width:100%;margin-top:4px;" placeholder="Descreva detalhes, incidentes ou melhorias..."></textarea>
              </label>
              <label style="display:block;margin-bottom:10px;">Sugestão de Marca/Modelo
                <input type="text" id="aval-modal-marca-modelo" style="width:100%;margin-top:4px;" placeholder="Ex: 3M Série X, Honeywell...">
              </label>
            </div>

            <label style="display:block;margin-bottom:16px;">Observações
              <textarea id="aval-modal-notes" rows="2" style="width:100%;margin-top:4px;" placeholder="Observações opcionais"></textarea>
            </label>

            <div style="display:flex;gap:8px;justify-content:flex-end;">
              <button class="ghost" id="aval-modal-cancel" type="button">Cancelar</button>
              <button class="primary" id="aval-modal-confirm" type="button">Confirmar</button>
            </div>
          </div>
        </div>
